name: Signed release APKs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Restore the retained release key and verify
        shell: bash
        env:
          RELEASE_KEY_BASE64: ${{ secrets.FIELDLOG_RELEASE_KEY_BASE64 }}
          FIELDLOG_RELEASE_STORE_PASSWORD: ${{ secrets.FIELDLOG_RELEASE_STORE_PASSWORD }}
          FIELDLOG_RELEASE_KEY_PASSWORD: ${{ secrets.FIELDLOG_RELEASE_KEY_PASSWORD }}
          FIELDLOG_RELEASE_KEY_ALIAS: fieldlog-release
          FIELDLOG_RELEASE_STORE_FILE: .private/fieldlog-release.p12
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY_BASE64"
          test -n "$FIELDLOG_RELEASE_STORE_PASSWORD"
          test -n "$FIELDLOG_RELEASE_KEY_PASSWORD"
          mkdir -p .private
          trap 'rm -f .private/fieldlog-release.p12' EXIT
          printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > "$FIELDLOG_RELEASE_STORE_FILE"
          ./gradlew --no-daemon :fieldlog-core:test assembleRelease lintRelease
          for module in phone-app glasses-app; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$module/build/outputs/apk/release/$module-release.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apks
          path: |
            phone-app/build/outputs/apk/release/*.apk
            glasses-app/build/outputs/apk/release/*.apk
