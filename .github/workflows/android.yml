name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, build and lint
        run: ./gradlew --no-daemon :fieldlog-core:test assembleDebug lintDebug
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            fieldlog-core/build/reports/tests/
            glasses-app/build/reports/lint-results-debug.*
            phone-app/build/reports/lint-results-debug.*
