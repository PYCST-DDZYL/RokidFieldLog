name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Test, build and lint
        run: ./gradlew --no-daemon :fieldlog-core:test assembleDebug lintDebug -PfieldlogDemo=true
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            fieldlog-core/build/reports/tests/
            fieldlog-core/build/test-results/test/*.xml
            glasses-app/build/reports/lint-results-debug.*
            phone-app/build/reports/lint-results-debug.*
      - name: Upload synthetic offline preview
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-offline-preview
          path: .local/offline-preview/
          include-hidden-files: true
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            glasses-app/build/outputs/apk/debug/*.apk
            phone-app/build/outputs/apk/debug/*.apk
